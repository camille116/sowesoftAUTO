<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Seuls ce site et Google (connexion + Drive) peuvent fournir du code ou recevoir des données. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data:; font-src 'self'; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <title>Revenus</title>
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="js/calc.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/export.js">
  <link rel="modulepreload" href="js/drive.js">
  <link rel="modulepreload" href="js/dnd.js">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d0d0d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f7f5f3'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Revenus, aperçu"><span class="brand-mark" aria-hidden="true"></span></a>
    <nav class="nav" aria-label="Sections">
      <a href="#/" data-route="overview">Aperçu</a>
      <a href="#/paiements" data-route="payments">Paiements</a>
      <a href="#/reglages" data-route="settings">Réglages</a>
    </nav>
    <div class="top-actions">
      <button type="button" class="sync" id="upload" hidden></button>
      <button type="button" class="sync" id="sync" hidden></button>
      <button type="button" class="btn btn-primary" id="add" aria-label="Ajouter un paiement"><span>Ajouter<span class="wide-only"> un paiement</span></span></button>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden></div>
  <main id="view" tabindex="-1"></main>

  <div id="live" class="sr" aria-live="polite"></div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-action" hidden></button></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
