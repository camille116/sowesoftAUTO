name: Auto-signature SoWeSoft (cours sans code)

# Signe automatiquement les cours SANS code (autonomie, projet…) depuis le cloud GitHub,
# sans que ton Mac soit allumé. Gratuit (minutes GitHub Actions), aucune carte bancaire.
#
# ⚠️ Les tâches planifiées peuvent démarrer avec quelques minutes de retard (normal chez GitHub).
# La fenêtre horaire est en UTC : 6h–18h UTC ≈ 7h/8h–19h/20h en France.

on:
  schedule:
    - cron: '*/20 6-18 * * 1-5' # toutes les 20 min, en semaine, 6h–18h UTC
  workflow_dispatch: {} # bouton « Run workflow » pour tester à la main

concurrency:
  group: autosign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium (pour Puppeteer)
        run: npx --yes puppeteer browsers install chrome

      # Garde la session SoWeSoft entre les passages (sinon reconnexion à chaque fois)
      - name: Restaurer la session SoWeSoft
        uses: actions/cache@v4
        with:
          path: data/sowesign-profile
          key: sowesign-profile-${{ github.run_id }}
          restore-keys: |
            sowesign-profile-

      - name: Signer si un cours sans code est en cours
        env:
          SOWESIGN_LOGIN_METHOD: password
          SOWESIGN_INSTITUTION: ${{ secrets.SOWESIGN_INSTITUTION }}
          SOWESIGN_EMAIL: ${{ secrets.SOWESIGN_EMAIL }}
          SOWESIGN_PASSWORD: ${{ secrets.SOWESIGN_PASSWORD }}
          SIGN_DRY_RUN: ${{ vars.SIGN_DRY_RUN || 'false' }}
          SIGNATURE_STYLE: ${{ vars.SIGNATURE_STYLE || 'claude' }}
          SIGNATURE_NAME: ${{ vars.SIGNATURE_NAME || 'Camille Redon' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: 'true'
        run: node scripts/ci/autosign.js
