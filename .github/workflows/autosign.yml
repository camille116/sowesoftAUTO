name: Auto-signature autonomie (Mac éteint)

# Signe les cours marqués AUTONOMIE dans l'emploi du temps, depuis GitHub (gratuit), même Mac éteint.
# Économe : une vérification rapide (sans navigateur) d'abord ; Chromium n'est installé que s'il y a
# vraiment un cours d'autonomie à signer. Heures en UTC (6h–18h UTC ≈ 7/8h–19/20h en France).
# GitHub peut lancer la tâche avec quelques minutes de retard.

on:
  schedule:
    - cron: '*/15 6-18 * * 1-5' # toutes les 15 min, en semaine
  workflow_dispatch: {}

concurrency:
  group: autosign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ICS_URL: ${{ secrets.ICS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (sans navigateur)
        run: npm ci --omit=dev --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Restaurer session SoWeSoft et état
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sowesign-profile
            data/ci-state.json
          key: sowesign-${{ github.run_id }}
          restore-keys: sowesign-
      - name: Y a-t-il un cours d'autonomie à signer ?
        id: check
        run: node scripts/ci/autosign.js --check
      - name: Installer Chromium
        if: steps.check.outputs.sign == 'true'
        run: npx --yes puppeteer browsers install chrome
      - name: Signer
        if: steps.check.outputs.sign == 'true'
        env:
          SOWESIGN_LOGIN_METHOD: password
          SOWESIGN_EMAIL: ${{ secrets.SOWESIGN_EMAIL }}
          SOWESIGN_PASSWORD: ${{ secrets.SOWESIGN_PASSWORD }}
          SIGN_DRY_RUN: ${{ vars.SIGN_DRY_RUN || 'false' }}
          SIGNATURE_STYLE: ${{ vars.SIGNATURE_STYLE || 'claude' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: 'true'
        run: node scripts/ci/autosign.js
      - name: Sauver session et état
        if: steps.check.outputs.sign == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/sowesign-profile
            data/ci-state.json
          key: sowesign-${{ github.run_id }}
